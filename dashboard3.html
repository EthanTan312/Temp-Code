<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hypervisor & VM Dashboard</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #3498db;
            --success-color: #2ecc71;
            --warning-color: #f39c12;
            --danger-color: #e74c3c;
            --light-bg: #f8f9fa;
            --dark-bg: #343a40;
            --card-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background-color: #f5f7fa;
            color: #333;
            line-height: 1.6;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            border-radius: 8px;
            box-shadow: var(--card-shadow);
        }
        
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        
        .subtitle {
            font-size: 1.2rem;
            opacity: 0.9;
        }
        
        .summary-stats {
            display: flex;
            justify-content: space-around;
            background-color: white;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 30px;
            box-shadow: var(--card-shadow);
        }
        
        .stat-item {
            text-align: center;
        }
        
        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            color: var(--secondary-color);
        }
        
        .stat-label {
            font-size: 0.9rem;
            color: #666;
            margin-top: 5px;
        }
        
        .hypervisor-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(550px, 1fr));
            gap: 25px;
        }
        
        .hypervisor-card {
            background: white;
            border-radius: 10px;
            box-shadow: var(--card-shadow);
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        
        .hypervisor-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15);
        }
        
        .hypervisor-header {
            background-color: var(--primary-color);
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .hypervisor-name {
            font-size: 1.5rem;
            font-weight: 600;
        }
        
        .ht-indicator {
            background-color: var(--secondary-color);
            color: white;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 500;
        }
        
        .hypervisor-details {
            padding: 20px;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }
        
        .detail-item {
            display: flex;
            flex-direction: column;
        }
        
        .detail-label {
            font-size: 0.85rem;
            color: #666;
            margin-bottom: 5px;
        }
        
        .detail-value {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--primary-color);
        }
        
        .vm-section {
            padding: 0 20px 20px;
        }
        
        .vm-title {
            font-size: 1.2rem;
            margin-bottom: 15px;
            color: var(--primary-color);
            border-bottom: 1px solid #eee;
            padding-bottom: 8px;
        }
        
        .vm-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }
        
        .vm-table th {
            background-color: var(--light-bg);
            color: var(--primary-color);
            text-align: left;
            padding: 12px 15px;
            font-weight: 600;
        }
        
        .vm-table td {
            padding: 12px 15px;
            border-bottom: 1px solid #eee;
        }
        
        .vm-table tr:last-child td {
            border-bottom: none;
        }
        
        .vm-table tr:hover {
            background-color: #f8f9fa;
        }
        
        .status-running {
            color: var(--success-color);
            font-weight: 600;
        }
        
        .status-shut-off {
            color: var(--danger-color);
            font-weight: 600;
        }
        
        .resource-bar {
            height: 8px;
            background-color: #e9ecef;
            border-radius: 4px;
            margin-top: 5px;
            overflow: hidden;
        }
        
        .resource-fill {
            height: 100%;
            background-color: var(--secondary-color);
            border-radius: 4px;
        }
        
        .no-data {
            text-align: center;
            padding: 40px;
            color: #666;
            font-size: 1.2rem;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: var(--secondary-color);
            font-size: 1.2rem;
        }
        
        .error-message {
            background-color: #ffeaea;
            color: var(--danger-color);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
            box-shadow: var(--card-shadow);
        }
        
        @media (max-width: 768px) {
            .hypervisor-grid {
                grid-template-columns: 1fr;
            }
            
            .hypervisor-details {
                grid-template-columns: 1fr;
            }
            
            .summary-stats {
                flex-wrap: wrap;
                gap: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Hypervisor & VM Dashboard</h1>
            <p class="subtitle">Monitoring physical servers and virtual machines</p>
        </header>
        
        <div id="error-container"></div>
        
        <div class="summary-stats">
            <div class="stat-item">
                <div class="stat-value" id="total-hypervisors">0</div>
                <div class="stat-label">Hypervisors</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="total-vms">0</div>
                <div class="stat-label">Virtual Machines</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="running-vms">0</div>
                <div class="stat-label">Running VMs</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="total-cpu">0</div>
                <div class="stat-label">Total CPU Cores</div>
            </div>
        </div>
        
        <div class="hypervisor-grid" id="hypervisor-container">
            <div class="loading">Loading data from data.json...</div>
        </div>
    </div>

    <script>
        // Function to load data from data.json
        async function loadData() {
            try {
                const response = await fetch('data.json');
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const data = await response.json();
                return data;
            } catch (error) {
                console.error('Error loading data:', error);
                
                // Show error message
                const errorContainer = document.getElementById('error-container');
                errorContainer.innerHTML = `
                    <div class="error-message">
                        <h3>Error Loading Data</h3>
                        <p>Could not load data from data.json. ${error.message}</p>
                        <p><strong>Note:</strong> For local development, you need to run a local server. You can use:</p>
                        <ul style="text-align: left; display: inline-block; margin-top: 10px;">
                            <li>Python: <code>python -m http.server 8000</code></li>
                            <li>Node.js: <code>npx http-server</code></li>
                            <li>PHP: <code>php -S localhost:8000</code></li>
                        </ul>
                        <p style="margin-top: 15px;">Using simulated data for demonstration.</p>
                    </div>
                `;
                
                // Return simulated data as fallback
                return getSimulatedData();
            }
        }

        // Simulated data for demonstration when data.json is not available
        function getSimulatedData() {
            return {
                "hypervisor": [
                    {
                        "hostname": "p-server-01",
                        "ht": true,
                        "cpu": 64,
                        "memory": 384,
                        "hugepage": 284,
                        "disk": 2200,
                        "VM": [
                            {
                                "hostname": "v-server-01",
                                "status": "running",
                                "cpu": 2,
                                "memory": 4,
                                "disk1": 30,
                                "disk2": 100
                            },
                            {
                                "hostname": "v-server-02",
                                "status": "running",
                                "cpu": 2,
                                "memory": 4,
                                "disk1": 25
                            },
                            {
                                "hostname": "v-server-03",
                                "status": "running",
                                "cpu": 4,
                                "memory": 8,
                                "disk1": 30,
                                "disk2": 100
                            }
                        ]
                    },
                    {
                        "hostname": "p-server-02",
                        "ht": false,
                        "cpu": 128,
                        "memory": 384,
                        "hugepage": 284,
                        "disk": 2200,
                        "VM": [
                            {
                                "hostname": "v-server-04",
                                "status": "running",
                                "cpu": 2,
                                "memory": 4,
                                "disk1": 30,
                                "disk2": 100
                            },
                            {
                                "hostname": "v-server-05",
                                "status": "running",
                                "cpu": 2,
                                "memory": 4,
                                "disk1": 25
                            },
                            {
                                "hostname": "v-server-06",
                                "status": "shut off",
                                "cpu": 4,
                                "memory": 8,
                                "disk1": 30,
                                "disk2": 100
                            }
                        ]
                    }
                ]
            };
        }

        // Calculate summary statistics
        function calculateStats(data) {
            const hypervisors = data.hypervisor;
            const totalHypervisors = hypervisors.length;
            let totalVMs = 0;
            let runningVMs = 0;
            let totalCPU = 0;
            
            hypervisors.forEach(hv => {
                totalVMs += hv.VM.length;
                totalCPU += hv.cpu;
                
                hv.VM.forEach(vm => {
                    if (vm.status === 'running') {
                        runningVMs++;
                    }
                });
            });
            
            document.getElementById('total-hypervisors').textContent = totalHypervisors;
            document.getElementById('total-vms').textContent = totalVMs;
            document.getElementById('running-vms').textContent = runningVMs;
            document.getElementById('total-cpu').textContent = totalCPU;
        }

        // Create hypervisor cards
        function createHypervisorCards(data) {
            const container = document.getElementById('hypervisor-container');
            container.innerHTML = '';
            
            data.hypervisor.forEach(hypervisor => {
                const card = document.createElement('div');
                card.className = 'hypervisor-card';
                
                // Calculate VM resource usage
                let totalVMCpu = 0;
                let totalVMMemory = 0;
                
                hypervisor.VM.forEach(vm => {
                    totalVMCpu += vm.cpu;
                    totalVMMemory += vm.memory;
                });
                
                const cpuUsagePercent = Math.round((totalVMCpu / hypervisor.cpu) * 100);
                const memoryUsagePercent = Math.round((totalVMMemory / hypervisor.memory) * 100);
                
                card.innerHTML = `
                    <div class="hypervisor-header">
                        <div class="hypervisor-name">${hypervisor.hostname}</div>
                        <div class="ht-indicator">${hypervisor.ht ? 'HT Enabled' : 'HT Disabled'}</div>
                    </div>
                    <div class="hypervisor-details">
                        <div class="detail-item">
                            <span class="detail-label">CPU Cores</span>
                            <span class="detail-value">${hypervisor.cpu} (${totalVMCpu} used)</span>
                            <div class="resource-bar">
                                <div class="resource-fill" style="width: ${cpuUsagePercent}%"></div>
                            </div>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">Memory (GB)</span>
                            <span class="detail-value">${hypervisor.memory} (${totalVMMemory} used)</span>
                            <div class="resource-bar">
                                <div class="resource-fill" style="width: ${memoryUsagePercent}%"></div>
                            </div>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">Hugepage (GB)</span>
                            <span class="detail-value">${hypervisor.hugepage}</span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">Disk (GB)</span>
                            <span class="detail-value">${hypervisor.disk}</span>
                        </div>
                    </div>
                    <div class="vm-section">
                        <h3 class="vm-title">Virtual Machines (${hypervisor.VM.length})</h3>
                        <table class="vm-table">
                            <thead>
                                <tr>
                                    <th>Hostname</th>
                                    <th>Status</th>
                                    <th>CPU</th>
                                    <th>Memory</th>
                                    <th>Disks</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${hypervisor.VM.map(vm => `
                                    <tr>
                                        <td>${vm.hostname}</td>
                                        <td><span class="status-${vm.status.replace(' ', '-')}">${vm.status}</span></td>
                                        <td>${vm.cpu} cores</td>
                                        <td>${vm.memory} GB</td>
                                        <td>${vm.disk1}GB${vm.disk2 ? ` + ${vm.disk2}GB` : ''}</td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                `;
                
                container.appendChild(card);
            });
        }

        // Initialize the dashboard
        async function initDashboard() {
            const data = await loadData();
            calculateStats(data);
            createHypervisorCards(data);
        }

        // Start the dashboard when the page loads
        document.addEventListener('DOMContentLoaded', initDashboard);
    </script>
</body>
</html>
